name: AI Pull Request Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  ai-review:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      - name: Run PR-Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          OPENAI__API_BASE: ${{ secrets.LLM_API_BASE }}
          OPENAI__KEY: ${{ secrets.LLM_API_TOKEN }}

          config.model: "deepseek-ai/DeepSeek-V4.1-Flash"
          config.fallback_models: '[]'

          github_action_config.auto_review: "true"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review"]'

          PR_REVIEWER.REQUIRE_SECURITY_REVIEW: "true"
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: "true"
          PR_REVIEWER.REQUIRE_RISK_ASSESSMENT: "true"
          PR_REVIEWER.REQUIRE_MERGE_RECOMMENDATION: "true"
          PR_REVIEWER.PUBLISH_MERGE_RECOMMENDATION_STATUS: "true"

